<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Bodová stupnice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;

  --paper:#FFFFFF;
  --ink:#1B1A17;
  --muted:#6C665D;
  --rule:#E0DCD3;
  --field-line:#C3BDB1;
  --grid:#EDF0F3;
  --mark:#A8271C;
  --mark-soft:rgba(168,39,28,.06);
  --warn-bg:#FBF1D9;
  --warn-line:#D9B94F;
  --warn-ink:#5C4608;
  --focus:#2F6FB0;
}
*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}

h1{
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-weight:600;
  font-size:1.5rem;
  line-height:1.2;
  margin:0 0 18px;
  padding-bottom:12px;
  border-bottom:1px solid var(--rule);
  letter-spacing:-.01em;
}
h2{
  font-family:"Source Serif 4",Georgia,serif;
  font-weight:600;
  font-size:.98rem;
  margin:22px 0 10px;
}

label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=number],select{
  width:100%;
  font:inherit;
  color:var(--ink);
  background:#fff;
  border:1px solid var(--field-line);
  border-radius:3px;
  padding:9px 10px;
}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.field+.field{margin-top:12px}

.bands{display:flex;flex-direction:column;gap:7px}
.band{display:flex;align-items:center;gap:12px}
.band .num{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:1.3rem;
  width:1.2em;
  text-align:center;
  color:var(--mark);
  flex:none;
}
.band .line{flex:1;border-bottom:1px dotted var(--rule)}
.band .pct{display:flex;align-items:center;gap:5px;flex:none}
.band .pct input{width:82px;text-align:right}
.band .pct span{font-size:.85rem;color:var(--muted)}
.band.last .rest{font-size:.85rem;color:var(--muted);flex:none}

.reset{
  font:inherit;font-size:.82rem;color:var(--muted);
  background:none;border:0;padding:8px 0 0;cursor:pointer;text-decoration:underline;
}
.reset:hover{color:var(--ink)}

.sheet{
  margin-top:22px;
  border:1px solid var(--rule);
  border-radius:4px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
  padding:14px 14px 6px;
}
table{border-collapse:collapse;width:100%}
th{
  text-align:left;font-weight:500;font-size:.75rem;color:var(--muted);
  padding:0 8px 8px 0;border-bottom:1px solid var(--rule);
}
th.r,td.r{text-align:right;padding-right:0}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
tbody tr:last-child td{border-bottom:0}
.g{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:1.6rem;line-height:1;color:var(--mark);width:1.4em;
}
.points{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.pctcell{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;width:4.6em}
tr.dead{background:var(--mark-soft)}
tr.dead .g,tr.dead .points{color:var(--muted)}

.warn{
  background:var(--warn-bg);border-left:3px solid var(--warn-line);color:var(--warn-ink);
  padding:10px 12px;border-radius:0 3px 3px 0;font-size:.85rem;margin-top:14px;
}
.warn p{margin:0}
.warn p+p{margin-top:5px}

details{margin-top:20px;border-top:1px solid var(--rule);padding-top:14px}
summary{cursor:pointer;font-size:.86rem;color:var(--muted)}
.alllist{
  margin-top:12px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:0 12px;
  font-size:.85rem;font-variant-numeric:tabular-nums;
}
.alllist span{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.alllist b{color:var(--mark);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<h1>Bodová stupnice</h1>

<div class="field">
  <label for="max">Maximum bodů</label>
  <input type="number" id="max" value="25" min="0.25" step="0.25" inputmode="decimal">
</div>
<div class="field">
  <label for="step">Body se udělují po</label>
  <select id="step">
    <option value="1" selected>1 bodu</option>
    <option value="0.5">půl bodu</option>
    <option value="0.25">čtvrt bodu</option>
  </select>
</div>

<h2>Hranice známek</h2>
<div class="bands">
  <div class="band">
    <span class="num">1</span><span class="line"></span>
    <span class="pct"><input type="number" class="gp" value="90" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Hranice známky 1"><span>%</span></span>
  </div>
  <div class="band">
    <span class="num">2</span><span class="line"></span>
    <span class="pct"><input type="number" class="gp" value="75" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Hranice známky 2"><span>%</span></span>
  </div>
  <div class="band">
    <span class="num">3</span><span class="line"></span>
    <span class="pct"><input type="number" class="gp" value="60" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Hranice známky 3"><span>%</span></span>
  </div>
  <div class="band">
    <span class="num">4</span><span class="line"></span>
    <span class="pct"><input type="number" class="gp" value="40" min="0" max="100" step="0.5" inputmode="decimal" aria-label="Hranice známky 4"><span>%</span></span>
  </div>
  <div class="band last">
    <span class="num">5</span><span class="line"></span>
    <span class="rest">vše nižší</span>
  </div>
</div>
<button type="button" class="reset" id="reset">Obnovit výchozí hodnoty</button>

<div class="sheet">
  <table>
    <thead>
      <tr><th>Známka</th><th class="r">Body</th><th class="r">Od</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="warnings"></div>

<details>
  <summary>Všechny možné bodové zisky</summary>
  <div class="alllist" id="alllist"></div>
</details>

</div>

<script>
(function(){
  "use strict";
  var KEY = "bodova-stupnice-v1";
  var EPS = 1e-9;
  var DEF = {max:25, step:1, floors:[90,75,60,40]};

  var elMax = document.getElementById("max");
  var elStep = document.getElementById("step");
  var elRows = document.getElementById("rows");
  var elWarn = document.getElementById("warnings");
  var elList = document.getElementById("alllist");
  var elReset = document.getElementById("reset");
  var pctInputs = Array.prototype.slice.call(document.querySelectorAll(".gp"));

  function num(v, f){ var n = parseFloat(v); return isFinite(n) ? n : f; }
  function cz(n){ return String(Math.round(n*100)/100).replace(".", ","); }
  function cz1(n){ return String(Math.round(n*10)/10).replace(".", ","); }
  function pctOf(p, max){ return max > 0 ? (p/max)*100 : 0; }

  function achievable(max, step){
    var out = [], k = Math.floor(max/step + EPS);
    if (k*step < max - EPS) out.push(max);
    for (; k >= 0; k--) out.push(Math.round(k*step*10000)/10000);
    if (out.length > 6000) out = out.slice(0, 6000);
    return out;
  }

  function gradeFor(points, max, floors){
    var p = pctOf(points, max);
    for (var i = 0; i < floors.length; i++){ if (p >= floors[i] - EPS) return i+1; }
    return 5;
  }

  function state(){
    return {
      max: num(elMax.value, 0),
      step: num(elStep.value, 1),
      floors: pctInputs.map(function(i){ return Math.min(100, Math.max(0, num(i.value, 0))); })
    };
  }

  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      return (s && typeof s === "object") ? s : null;
    }catch(e){ return null; }
  }

  function render(){
    var s = state(), warnings = [];

    if (!(s.max > 0)){
      elRows.innerHTML = '<tr><td colspan="3" class="pctcell">Zadejte maximum bodů.</td></tr>';
      elWarn.innerHTML = "";
      elList.innerHTML = "";
      return;
    }

    for (var i = 1; i < s.floors.length; i++){
      if (s.floors[i] >= s.floors[i-1]){
        warnings.push("Hranice známky " + (i+1) + " (" + cz(s.floors[i]) + " %) není nižší než hranice známky " + i + " (" + cz(s.floors[i-1]) + " %). Známku " + i + " nelze udělit.");
      }
    }

    var scores = achievable(s.max, s.step);
    var bands = [];
    for (var g = 1; g <= 5; g++) bands.push({grade:g, hi:null, lo:null});

    scores.forEach(function(pt){
      var b = bands[gradeFor(pt, s.max, s.floors) - 1];
      if (b.hi === null) b.hi = pt;
      b.lo = pt;
    });

    var html = "";
    bands.forEach(function(b){
      var dead = (b.hi === null), pts, from;
      if (dead){
        warnings.push("Známku " + b.grade + " nelze udělit – nespadá do ní žádný možný počet bodů.");
        pts = "—"; from = "";
      } else if (Math.abs(b.hi - b.lo) < EPS){
        pts = cz(b.lo);
        from = cz1(pctOf(b.lo, s.max)) + " %";
      } else {
        pts = cz(b.lo) + " – " + cz(b.hi);
        from = cz1(pctOf(b.lo, s.max)) + " %";
      }
      html += '<tr class="' + (dead ? "dead" : "") + '">'
            + '<td class="g">' + b.grade + '</td>'
            + '<td class="r points">' + pts + '</td>'
            + '<td class="r pctcell">' + from + '</td>'
            + '</tr>';
    });
    elRows.innerHTML = html;

    if (s.max < 12 && s.step === 1){
      warnings.push("Jeden bod má hodnotu " + cz1(100/s.max) + " %, hranice jsou proto velmi hrubé.");
    }

    elWarn.innerHTML = warnings.length
      ? '<div class="warn">' + warnings.map(function(w){ return "<p>" + w + "</p>"; }).join("") + "</div>"
      : "";

    var list = "";
    for (var j = scores.length - 1; j >= 0; j--){
      list += "<span>" + cz(scores[j]) + " <b>" + gradeFor(scores[j], s.max, s.floors) + "</b></span>";
    }
    elList.innerHTML = list;

    save(s);
  }

  elReset.addEventListener("click", function(){
    elMax.value = DEF.max;
    elStep.value = String(DEF.step);
    pctInputs.forEach(function(inp, i){ inp.value = DEF.floors[i]; });
    render();
  });

  [elMax, elStep].concat(pctInputs).forEach(function(inp){
    inp.addEventListener("input", render);
    inp.addEventListener("change", render);
  });

  var saved = load();
  if (saved){
    if (isFinite(saved.max)) elMax.value = saved.max;
    if (saved.step) elStep.value = String(saved.step);
    if (Array.isArray(saved.floors) && saved.floors.length === 4){
      pctInputs.forEach(function(inp, i){ if (isFinite(saved.floors[i])) inp.value = saved.floors[i]; });
    }
  }
  render();
})();
</script>
</body>
</html>
